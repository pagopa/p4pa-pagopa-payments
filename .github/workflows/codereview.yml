name: Code Review

on:
  # Running on push in order to update SonarCloud with the latest coverage report
  push:
    branches:
      - main
      - uat
      - develop
    paths:
      - 'src/**'
      - 'gradle.lockfile'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
  pull_request:
    types:
      - opened
      - edited
      - synchronize
    paths:
      - 'src/**'
      - 'gradle.lockfile'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c #v6.0.0
        with:
          distribution: 'corretto'
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        working-directory: ./
        run: ./gradlew clean build jacocoTestReport -DtargetBranch=${{ github.event.pull_request.base.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sonar Scan
        working-directory: ./
        run: >
          ./gradlew sonar
          -Dorg.gradle.jvmargs=-Xmx4096M
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONARCLOUD_ORG }}
          -Dsonar.projectKey=${{ vars.SONARCLOUD_PROJECT_KEY }}
          -Dsonar.projectName="${{ vars.SONARCLOUD_PROJECT_NAME }}"
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          -Dsonar.sources=src/main
          -Dsonar.tests=src/test
          -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
          -Dsonar.exclusions='**/enums/**, **/model/**, **/dto/**, **/*Constant*, **/*Config.java, **/*Scheduler.java, **/*Application.java, **/src/test/**, **/Dummy*.java, **/exception/**/*Exception.java'
