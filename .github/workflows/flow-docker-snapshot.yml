name: 📦 Flow Snapshot Docker

on:
  # no more interested in push event, we want to trigger the workflow only manually
  #push:
  #  branches-ignore:
  #    - 'develop'
  #    - 'uat'
  #    - 'main'
  #  paths-ignore:
  #    - 'CODEOWNERS'
  #    - '**.md'
  #    - '.**'
  workflow_dispatch:
    inputs:
      docker_build_enabled:
        description: 'Enable Docker build'
        required: false
        default: 'true'
      azdo_trigger_enabled:
        description: 'Enable Azure DevOps trigger'
        required: false
        default: 'true'
      argocd_target_branch:
          description: 'argocd target branch name'
          required: false
          default: 'main'
      postman_branch:
        description: 'postman branch name'
        required: false
        default: 'develop'

env:
  # branch chosen by workflow_dispatch or by push event
  CURRENT_BRANCH: ${{ github.event.inputs.branch || github.ref_name }}

permissions:
  packages: write
  contents: read

jobs:
  checkout:
    name: 🔖 Checkout Repository
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: ${{ env.CURRENT_BRANCH }}

  docker-build:
    name: 📦 Docker Build and Push
    needs: checkout
    runs-on: ubuntu-22.04
    if: ${{ github.event_name == 'push' || github.event.inputs.docker_build_enabled == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: ${{ env.CURRENT_BRANCH }}

      - name: Run Snapshot Docker Build/Push
        # https://github.com/pagopa/github-actions-template/releases/tag/v2.8.1
        uses: pagopa/github-actions-template/payments-flow-docker-snapshot@5e788a4717069100914e66149997ecfd4c48b746
        with:
          current_branch: ${{ env.CURRENT_BRANCH }}
          extra_build_args: |
            IMAGE=ghcr.io/pagopa/p4pa-automation/eclipse-temurin

  azure-devops-trigger:
    name: 🅰️ Azure DevOps Pipeline Trigger
    needs: docker-build
    runs-on: ubuntu-22.04
    if: |
      always() &&
      needs.docker-build.result != 'failure' &&
      github.event.inputs.azdo_trigger_enabled == 'true'
    steps:
      - name: Trigger Azure DevOps Pipeline
        # https://github.com/pagopa/github-actions-template/releases/tag/v2.8.1
        uses: pagopa/github-actions-template/azure-devops-trigger-pipeline@5e788a4717069100914e66149997ecfd4c48b746
        with:
          enable_azure_devops_step: 'true'
          azure_devops_project_url: 'https://dev.azure.com/pagopaspa/p4pa-projects'
          azure_devops_pipeline_name: 'p4pa-payhub-deploy-aks.deploy'
          azure_devops_pat: ${{ secrets.AZURE_DEVOPS_TOKEN }}
          azure_template_parameters: |
            {
              "APPS_TOP": "[p4pa-pagopa-payments]",
              "APPS_MID": "[]",
              "APPS_EXT": "[]",
              "ARGOCD_TARGET_BRANCH": "${{ github.event.inputs.argocd_target_branch }}",
              "POSTMAN_BRANCH": "${{ github.event.inputs.postman_branch }}",
              "TRIGGER_MESSAGE": "p4pa-pagopa-payments"
            }
