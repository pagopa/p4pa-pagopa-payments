name: 🚀 Flow Release

on:
  push:
    branches:
      - develop
      - uat
      - main
    paths-ignore:
      - 'CODEOWNERS'
      - '**.md'
      - '.**'
  workflow_dispatch:

permissions:
  packages: write
  contents: write

jobs:
  checkout:
    name: 🔖 Checkout Repository
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: ${{ github.ref_name }}

  payments-flow-release:
    name: 🚀 Release
    runs-on: ubuntu-22.04
    needs: checkout
    steps:
      - name: 🚀 release + docker
        # https://github.com/pagopa/github-actions-template/releases/tag/v2.8.1
        uses: pagopa/github-actions-template/payments-flow-release@5e788a4717069100914e66149997ecfd4c48b746
        with:
          current_branch: ${{ github.ref_name }}
          produce_release_notes: ${{ case( github.ref_name == 'main', 'true', 'false') }}
          extra_build_args: |
            IMAGE=ghcr.io/pagopa/p4pa-automation/eclipse-temurin

  azure-devops-trigger:
    name: 🅰️ Azure DevOps Pipeline Trigger
    if: github.ref_name == 'develop'
    needs: payments-flow-release
    runs-on: ubuntu-22.04
    steps:
      - name: Trigger Azure DevOps Pipeline
        # https://github.com/pagopa/github-actions-template/releases/tag/v2.8.1
        uses: pagopa/github-actions-template/azure-devops-trigger-pipeline@5e788a4717069100914e66149997ecfd4c48b746
        with:
          enable_azure_devops_step: 'true'
          azure_devops_project_url: 'https://dev.azure.com/pagopaspa/p4pa-projects'
          azure_devops_pipeline_name: 'p4pa-payhub-deploy-aks.deploy'
          azure_devops_pat: ${{ secrets.AZURE_DEVOPS_TOKEN }}
          azure_template_parameters: |
            {
              "APPS_TOP": "[p4pa-pagopa-payments]",
              "APPS_MID": "[]",
              "APPS_EXT": "[]",
              "POSTMAN_BRANCH": "${{ github.ref_name }}",
              "TRIGGER_MESSAGE": "p4pa-pagopa-payments"
            }
