server:
  http: "\${SERVER_PORT:8080}"

spring:
  application:
    name: ${artifactId}
    version: ${version}
  jmx.enabled: true
  threads:
    virtual:
      enabled: "\${VIRTUAL_THREADS_ENABLED:true}"

management:
  info:
    build.enabled: true
    java.enabled: true
    git.enabled: true
  tracing:
    baggage.remote-fields:
      - X-user-id
  endpoints:
    jmx:
      exposure.include: "*"
    web:
      exposure:
        include: health, info, prometheus, metrics, caches
      base-path: /actuator
  endpoint:
    health:
      probes.enabled: true
      logging.slow-indicator-threshold: "\${HEALTH_ACTUATOR_LOGGER_TIMEOUT_DURATION:PT1S}"
      group:
        readiness.include: "*"
        liveness.include: livenessState,diskSpace,ping
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${artifactId}
    export:
      prometheus:
        enabled: true
        step: 1m
        descriptions: true
    enable:
      jvm: true
      process: true
      system: true
      http: true
      logback: true

logging:
  level:
    root: "\${LOG_LEVEL_ROOT:INFO}"
    it.gov.pagopa: "\${LOG_LEVEL_PAGOPA:INFO}"
    org.springframework: "\${LOG_LEVEL_SPRING:INFO}"
    org.springframework.boot.availability: "\${LOG_LEVEL_SPRING_BOOT_AVAILABILITY:DEBUG}"
    it.gov.pagopa.pu.pagopapayments.exception.PagopaPaymentsExceptionHandler: "\${LOGGING_LEVEL_API_REQUEST_EXCEPTION:INFO}"
    org.springdoc.core.utils.SpringDocAnnotationsUtils: "\${LOG_LEVEL_SPRING_DOC:ERROR}"
    PERFORMANCE_LOG: "\${LOG_LEVEL_PERFORMANCE_LOG:INFO}"
    PERFORMANCE_LOG.API_REQUEST: "\${LOG_LEVEL_PERFORMANCE_LOG_API_REQUEST:\${logging.level.PERFORMANCE_LOG}}"
    PERFORMANCE_LOG.REST_INVOKE: "\${LOG_LEVEL_PERFORMANCE_LOG_REST_INVOKE:\${logging.level.PERFORMANCE_LOG}}"

soap:
  pagopa-payments:
    wsdl-base-url: "\${PAGOPA_PAYMENTS_WSDL_BASE_URL:http://localhost:8080}"
    node-for-pa-url: "\${APP_NODE_FOR_PA_URL:}"

rest:
  defaults:
    connection-pool:
      size: "\${DEFAULT_REST_CONNECTION_POOL_SIZE:10}"
      size-per-route: "\${DEFAULT_REST_CONNECTION_POOL_SIZE_PER_ROUTE:5}"
      time-to-live-minutes: "\${DEFAULT_REST_CONNECTION_POOL_TIME_TO_LIVE_MINUTES:10}"
    timeout:
      connect-millis: "\${DEFAULT_REST_TIMEOUT_CONNECT_MILLIS:120000}"
      read-millis: "\${DEFAULT_REST_TIMEOUT_READ_MILLIS:120000}"
  auth:
    base-url: "\${AUTH_SERVER_BASE_URL:}"
    max-attempts: "\${AUTH_MAX_ATTEMPTS:3}" # It's counting also the first attempt
    wait-time-millis: "\${AUTH_WAIT_TIME_MILLIS:500}"
    print-body-when-error: "\${AUTH_PRINT_BODY_WHEN_ERROR:true}"
    post-token:
      client_secret: "\${AUTH_CLIENT_SECRET:clientsecret}"
  debt-position:
    base-url: "\${DEBT_POSITION_BASE_URL:}"
    max-attempts: "\${DEBT_POSITION_MAX_ATTEMPTS:3}" # It's counting also the first attempt
    wait-time-millis: "\${DEBT_POSITION_WAIT_TIME_MILLIS:500}"
    print-body-when-error: "\${DEBT_POSITION_PRINT_BODY_WHEN_ERROR:true}"
  fileshare:
    base-url: "\${FILESHARE_BASE_URL:}"
    max-attempts: "\${FILE_SHARE_MAX_ATTEMPTS:3}" # It's counting also the first attempt
    wait-time-millis: "\${FILE_SHARE_WAIT_TIME_MILLIS:500}"
    print-body-when-error: "\${FILE_SHARE_PRINT_BODY_WHEN_ERROR:true}"
  organization:
    base-url: "\${ORGANIZATION_BASE_URL:}"
    max-attempts: "\${ORGANIZATION_MAX_ATTEMPTS:3}" # It's counting also the first attempt
    wait-time-millis: "\${ORGANIZATION_WAIT_TIME_MILLIS:500}"
    print-body-when-error: "\${ORGANIZATION_PRINT_BODY_WHEN_ERROR:true}"
  pagopa-node-services:
    aca:
      base-url: "\${PAGOPA_NODE_ACA_BASE_URL:}"
      max-attempts: "\${PAGOPA_NODE_ACA_MAX_ATTEMPTS:3}" # It's counting also the first attempt
      wait-time-millis: "\${PAGOPA_NODE_ACA_WAIT_TIME_MILLIS:500}"
      print-body-when-error: "\${PAGOPA_NODE_ACA_PRINT_BODY_WHEN_ERROR:true}"
    gpd:
      base-url: "\${PAGOPA_NODE_GPD_BASE_URL:}"
      max-attempts: "\${PAGOPA_NODE_GPD_MAX_ATTEMPTS:3}" # It's counting also the first attempt
      wait-time-millis: "\${PAGOPA_NODE_GPD_WAIT_TIME_MILLIS:500}"
      print-body-when-error: "\${PAGOPA_NODE_GPD_PRINT_BODY_WHEN_ERROR:true}"
  pagopa-taxonomies:
    base-url: "\${PAGOPA_TAXONOMIES_BASE_URL:}"
    print-body-when-error: "\${PAGOPA_TAXONOMIES_PRINT_BODY_WHEN_ERROR:true}"
  pagopa-print-payment-notice:
    base-url: "\${PAGOPA_PRINT_PAYMENT_NOTICE_BASE_URL:}"
    api-key: "\${PAGOPA_PRINT_PAYMENT_NOTICE_API_KEY:}"
    max-attempts: "\${PAGOPA_PRINT_PAYMENT_NOTICE_MAX_ATTEMPTS:3}" # It's counting also the first attempt
    wait-time-millis: "\${PAGOPA_PRINT_PAYMENT_NOTICE_WAIT_TIME_MILLIS:500}"
    print-body-when-error: "\${PAGOPA_PRINT_PAYMENT_NOTICE_PRINT_BODY_WHEN_ERROR:true}"

